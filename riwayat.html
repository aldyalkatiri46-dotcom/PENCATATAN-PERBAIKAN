<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riwayat Perbaikan - Workshop KM36</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- SheetJS (XLSX) untuk Export Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- jsPDF & AutoTable untuk Export PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

  <!-- Header & Navigation -->
  <header class="bg-indigo-900 text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-7xl mx-auto py-4 px-6 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-wrench text-3xl text-amber-400"></i>
        <div>
          <h1 class="text-2xl font-bold tracking-wide">WORKSHOP KM36</h1>
          <p class="text-indigo-200 text-xs">Sistem Pencatatan Perbaikan Bengkel</p>
        </div>
      </div>

      <!-- Menu Navigasi -->
      <nav class="flex items-center gap-2">
        <a href="index.html" class="bg-indigo-800/60 hover:bg-indigo-700 text-indigo-100 hover:text-white px-4 py-2 rounded-lg font-semibold text-sm flex items-center gap-2 transition border border-indigo-700">
          <i class="fa-solid fa-pen-to-square"></i> Input Perbaikan
        </a>
        <a href="riwayat.html" class="bg-indigo-700 text-white px-4 py-2 rounded-lg font-semibold text-sm flex items-center gap-2 shadow border border-indigo-500">
          <i class="fa-solid fa-list-check"></i> Riwayat
        </a>
        <a href="statistik.html" class="bg-indigo-800/60 hover:bg-indigo-700 text-indigo-100 hover:text-white px-4 py-2 rounded-lg font-semibold text-sm flex items-center gap-2 transition border border-indigo-700">
          <i class="fa-solid fa-chart-line text-amber-400"></i> Statistik
        </a>
      </nav>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

    <!-- Table Container -->
    <div class="bg-white rounded-xl shadow-md p-6 border border-slate-200 overflow-hidden">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 border-b pb-4">
        <div>
          <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
            <i class="fa-solid fa-list-check text-indigo-600"></i> Riwayat Pencatatan Perbaikan
          </h2>
          <p class="text-xs text-slate-500">Daftar seluruh laporan perbaikan yang telah diinputkan</p>
        </div>

        <!-- Group Aksi & Export -->
        <div class="flex flex-wrap items-center gap-2 w-full md:w-auto">
          <button id="exportExcelBtn" class="flex-1 md:flex-none text-sm bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg transition font-semibold flex items-center justify-center gap-2 shadow-sm">
            <i class="fa-solid fa-file-excel"></i> Export Excel
          </button>
          <button id="exportPdfBtn" class="flex-1 md:flex-none text-sm bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-lg transition font-semibold flex items-center justify-center gap-2 shadow-sm">
            <i class="fa-solid fa-file-pdf"></i> Export PDF
          </button>
          <button id="clearDataBtn" class="flex-1 md:flex-none text-sm bg-red-100 text-red-600 hover:bg-red-200 px-4 py-2 rounded-lg transition font-medium flex items-center justify-center gap-2">
            <i class="fa-solid fa-trash"></i> Hapus Semua
          </button>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse min-w-[800px]">
          <thead>
            <tr class="bg-slate-100 text-slate-600 text-xs uppercase tracking-wider border-b">
              <th class="p-3">Tanggal</th>
              <th class="p-3">Bengkel</th>
              <th class="p-3">Tim Perbaikan</th>
              <th class="p-3">Shift</th>
              <th class="p-3 text-center">Di Tempat</th>
              <th class="p-3 text-center">Sedang</th>
              <th class="p-3 text-center">Akan Datang</th>
              <th class="p-3 text-center bg-indigo-50 text-indigo-800">Total Req.</th>
              <th class="p-3 text-center bg-red-50 text-red-800">Darurat</th>
              <th class="p-3 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="dataTable" class="divide-y divide-slate-200 text-sm">
            <!-- Data dimasukkan secara dinamis via JS -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script>
    let records = JSON.parse(localStorage.getItem('workshop_records')) || [];
    const dataTable = document.getElementById('dataTable');

    function renderTable() {
      dataTable.innerHTML = '';
      if (records.length === 0) {
        dataTable.innerHTML = `
          <tr>
            <td colspan="10" class="text-center py-8 text-slate-400">Belum ada data pencatatan perbaikan.</td>
          </tr>
        `;
        return;
      }

      records.forEach((record, index) => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-50';
        tr.innerHTML = `
          <td class="p-3 font-medium">${record.tanggal}</td>
          <td class="p-3">${record.namaBengkel}</td>
          <td class="p-3 font-semibold text-slate-700">${record.timPerbaikan}</td>
          <td class="p-3">
            <span class="px-2.5 py-1 rounded-full text-xs font-bold ${record.shiftKerja === 'Pagi' ? 'bg-amber-100 text-amber-800' : 'bg-slate-700 text-white'}">
              ${record.shiftKerja}
            </span>
          </td>
          <td class="p-3 text-center">${record.diTempat}</td>
          <td class="p-3 text-center">${record.sedangPerbaikan}</td>
          <td class="p-3 text-center">${record.akanDiperbaiki}</td>
          <td class="p-3 text-center font-bold text-indigo-700 bg-indigo-50/50">${record.totalPermintaan}</td>
          <td class="p-3 text-center font-bold text-red-600 bg-red-50/50">${record.perbaikanDarurat}</td>
          <td class="p-3 text-center">
            <button onclick="deleteRecord(${index})" class="text-red-500 hover:text-red-700 transition" title="Hapus Baris Ini">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </td>
        `;
        dataTable.appendChild(tr);
      });
    }

    function deleteRecord(index) {
      if (confirm('Apakah Anda yakin ingin menghapus catatan ini?')) {
        records.splice(index, 1);
        localStorage.setItem('workshop_records', JSON.stringify(records));
        renderTable();
      }
    }

    document.getElementById('clearDataBtn').addEventListener('click', () => {
      if (records.length === 0) return;
      if (confirm('Apakah Anda yakin ingin menghapus seluruh data riwayat?')) {
        records = [];
        localStorage.removeItem('workshop_records');
        renderTable();
      }
    });

    // FITUR EXPORT EXCEL
    document.getElementById('exportExcelBtn').addEventListener('click', () => {
      if (records.length === 0) {
        alert('Tidak ada data untuk diexport!');
        return;
      }

      const excelData = records.map(item => ({
        'Tanggal': item.tanggal,
        'Nama Bengkel': item.namaBengkel,
        'Tim Perbaikan': item.timPerbaikan,
        'Shift Kerja': item.shiftKerja,
        'Di Tempat': item.diTempat,
        'Sedang Perbaikan': item.sedangPerbaikan,
        'Akan Diperbaiki': item.akanDiperbaiki,
        'Total Permintaan': item.totalPermintaan,
        'Perbaikan Darurat': item.perbaikanDarurat
      }));

      const worksheet = XLSX.utils.json_to_sheet(excelData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Riwayat Perbaikan");

      const max_width = excelData.reduce((w, r) => Math.max(w, r['Tim Perbaikan'].length), 15);
      worksheet['!cols'] = [
        { wch: 12 }, { wch: 18 }, { wch: max_width + 2 }, { wch: 12 },
        { wch: 10 }, { wch: 10 }, { wch: 10 }, { wch: 14 }, { wch: 14 }
      ];

      const fileName = `Laporan_Perbaikan_KM36_${new Date().toISOString().slice(0,10)}.xlsx`;
      XLSX.writeFile(workbook, fileName);
    });

    // FITUR EXPORT PDF
    document.getElementById('exportPdfBtn').addEventListener('click', () => {
      if (records.length === 0) {
        alert('Tidak ada data untuk diexport!');
        return;
      }

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('landscape', 'mm', 'a4');

      doc.setFontSize(16);
      doc.setTextColor(30, 27, 75);
      doc.text("LAPORAN RIWAYAT PERBAIKAN WORKSHOP KM36", 14, 15);

      doc.setFontSize(10);
      doc.setTextColor(100);
      doc.text(`Tanggal Cetak: ${new Date().toLocaleDateString('id-ID')}`, 14, 22);

      const tableHeaders = [
        ["Tanggal", "Bengkel", "Tim Perbaikan", "Shift", "Di Tempat", "Sedang", "Akan Datang", "Total Req.", "Darurat"]
      ];

      const tableRows = records.map(item => [
        item.tanggal,
        item.namaBengkel,
        item.timPerbaikan,
        item.shiftKerja,
        item.diTempat,
        item.sedangPerbaikan,
        item.akanDiperbaiki,
        item.totalPermintaan,
        item.perbaikanDarurat
      ]);

      doc.autoTable({
        head: tableHeaders,
        body: tableRows,
        startY: 28,
        theme: 'grid',
        headStyles: {
          fillColor: [49, 46, 129],
          textColor: [255, 255, 255],
          fontStyle: 'bold',
          halign: 'center'
        },
        columnStyles: {
          4: { halign: 'center' },
          5: { halign: 'center' },
          6: { halign: 'center' },
          7: { halign: 'center', fontStyle: 'bold' },
          8: { halign: 'center', fontStyle: 'bold', textColor: [220, 38, 38] }
        },
        styles: { fontSize: 9, cellPadding: 3 }
      });

      const fileName = `Laporan_Perbaikan_KM36_${new Date().toISOString().slice(0,10)}.pdf`;
      doc.save(fileName);
    });

    renderTable();
  </script>
</body>
</html>
